---
apiVersion: api.cerbos.dev/v1
derivedRoles:
  name: json_file_derived_roles
  definitions:
    # Requirement 1: Assign special update permission to Chris
    - name: chris_admin_privilege
      parentRoles: ["member"]
      condition:
        match:
          expr: "P.id == 'chris@chriscn.cn'"

    # Requirement 2: Logic for sensitive files
    # This role is active if the file is sensitive AND the user is NOT admin/Chris
    - name: sensitive_file_access_denied
      parentRoles: ["user", "member"]
      condition:
        match:
          all:
            of:
              - expr: "R.attr.fileName.matches('(?i)sensitive')"
              - expr: "P.id != 'chris@chriscn.cn'"
              - expr: "!'admin' in P.roles"
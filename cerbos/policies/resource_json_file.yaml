---
apiVersion: api.cerbos.dev/v1
resourcePolicy:
  version: "default"
  resource: "json_file"
  rules:
    - actions: ["*"]
      effect: EFFECT_ALLOW
      roles:
        - admin
    - actions: ["read", "create"]
      effect: EFFECT_ALLOW
      roles:
        - member
    - actions: ["read"]
      effect: EFFECT_ALLOW
      roles:
        - user

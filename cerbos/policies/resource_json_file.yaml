---
apiVersion: api.cerbos.dev/v1
resourcePolicy:
  version: "default"
  resource: "json_file"
  importDerivedRoles:
    - json_file_derived_roles
  rules:
    - actions: ["*"]
      effect: EFFECT_ALLOW
      roles: ["admin"]
      
    - actions: ["read", "create"]
      effect: EFFECT_ALLOW
      derivedRoles: ["member"]
      
    - actions: ["read"]
      effect: EFFECT_ALLOW
      derivedRoles: ["user"]